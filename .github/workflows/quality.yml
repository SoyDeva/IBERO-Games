name: Quality

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && 'agent/add-configurable-learning-tools-v24' || github.ref_name }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guarded configurable learning tools integration
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: node scripts/add-configurable-learning-tools.mjs
      - name: Reject unexpected transformed files
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          unexpected=$(git diff --name-only | grep -Ev '^js/app\.js$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected changes:"
            echo "$unexpected"
            exit 1
          fi
      - name: Run checks
        run: npm run check
      - name: Commit configurable learning tools integration
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet -- js/app.js; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "feat: connect configurable learning tools"
          git push origin HEAD:agent/add-configurable-learning-tools-v24