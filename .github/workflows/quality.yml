name: Quality

on:
  push:
    branches: [main, 'agent/**']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || '' }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guarded learning session integration
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/add-learning-sessions-goals-v24' && github.actor != 'github-actions[bot]'
        run: node scripts/add-learning-sessions.mjs
      - name: Reject unexpected transformed files
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/add-learning-sessions-goals-v24' && github.actor != 'github-actions[bot]'
        run: |
          unexpected=$(git diff --name-only | grep -Ev '^(js/app\.js|docs/architecture\.md)$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected changes:"
            echo "$unexpected"
            exit 1
          fi
      - name: Run checks
        run: npm run check
      - name: Commit learning session integration
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/add-learning-sessions-goals-v24' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet -- js/app.js docs/architecture.md; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js docs/architecture.md
          git commit -m "feat: connect learning sessions goals and teacher report"
          git push origin HEAD:agent/add-learning-sessions-goals-v24
