name: Apply guarded flight input refactor

on:
  push:
    branches:
      - agent/refactor-flight-input-v24

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: agent/refactor-flight-input-v24
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Transform space-game.js only
        run: node scripts/refactor-flight-input.mjs
      - name: Reject unexpected file changes
        run: |
          unexpected=$(git diff --name-only | grep -v '^js/space-game.js$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected changes:"
            echo "$unexpected"
            exit 1
          fi
      - name: Validate complete project
        run: npm run check
      - name: Commit space-game.js
        run: |
          if git diff --quiet -- js/space-game.js; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/space-game.js
          git commit -m "refactor: connect flight input controller"
          git push origin HEAD:agent/refactor-flight-input-v24
