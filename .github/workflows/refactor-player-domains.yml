name: Apply player domain refactor

on:
  push:
    branches: ['agent/refactor-player-domains-v24']

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/refactor-player-domains-v24
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply guarded transformation
        run: node scripts/refactor-player-domains.mjs
      - name: Validate project
        run: npm run check
      - name: Commit transformed application
        run: |
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js
          git commit -m "refactor: connect player domain services"
          git push
