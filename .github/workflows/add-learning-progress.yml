name: Apply guarded learning progress integration

on:
  push:
    branches:
      - agent/add-learning-progress-v24

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: agent/add-learning-progress-v24
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Connect learning progress
        run: node scripts/add-learning-progress.mjs
      - name: Reject unexpected file changes
        run: |
          unexpected=$(git diff --name-only | grep -Ev '^(js/app\.js|index\.html|docs/architecture\.md)$' || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected changes:"
            echo "$unexpected"
            exit 1
          fi
      - name: Validate complete project
        run: npm run check
      - name: Commit integration
        run: |
          if git diff --quiet -- js/app.js index.html docs/architecture.md; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js index.html docs/architecture.md
          git commit -m "feat: connect pedagogical progress and adaptation"
          git push origin HEAD:agent/add-learning-progress-v24
